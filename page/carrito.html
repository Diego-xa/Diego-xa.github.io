    <section class="container text-center my-5 text-white">
        <img src="../dist/imagenes/logo mochila.png" alt="Logo" width="20%">
        <h2 class="mt-3">Registro de Usuario</h2>

        <form class="mt-4">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="mb-3 text-white">
                        <label class="form-label">Nombre <span>(*)</span></label>
                        <input type="text" class="form-control" placeholder="Ingrese su nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Ingrese su email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" placeholder="Ingrese su contraseña" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Comentarios</label>
                        <textarea class="form-control" rows="4" maxlength="100"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Enviar</button>
                </div>
            </div>
        </form>
